<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentBridge</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1015;
      color: #e7ecf1;
    }
    * { box-sizing: border-box; }

    @keyframes ab-spin {
      to { transform: rotate(360deg); }
    }

    .ab-shell {
      display: flex;
      min-height: 100vh;
    }
    .ab-sidebar {
      width: 240px;
      flex-shrink: 0;
      background: #141c24;
      border-right: 1px solid #242e3a;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .ab-main {
      flex: 1;
      min-width: 0;
      padding: 2.5rem;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #242e3a;
      border-radius: 6px;
    }

    @media (max-width: 860px) {
      .ab-sidebar { width: 68px; }
      .ab-brand-text,
      .ab-section-title,
      .ab-nav-label,
      .ab-nav-pending { display: none; }
      .ab-nav-link { justify-content: center; }
      .ab-main { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/dist/bundle.js"></script>
</body>
</html>
