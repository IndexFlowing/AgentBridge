[package]
name = "agentbridge"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Connect AI brains to local coding agents through MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "ai", "coding-agent", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/IndexFlowing/AgentBridge"
documentation = "https://docs.rs/agentbridge"
homepage = "https://www.mandarinclips.com"
authors = ["IndexFlowing"]

[[bin]]
name = "agentbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
eframe = "0.31"
egui = "0.31"
tray-icon = "0.21"
rfd = "0.15"
auto-launch = "0.5"
open = "5"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
