[package]
name = "agentbridge"
version = "1.0.4"
edition = "2021"
rust-version = "1.88"
description = "Connect AI brains to local coding agents through MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "ai", "coding-agent", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/IndexFlowing/AgentBridge"
documentation = "https://docs.rs/agentbridge"
homepage = "https://www.mandarinclips.com"
authors = ["IndexFlowing"]

[[bin]]
name = "agentbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
mime_guess = "2.0"      # <--- 新增：用于根据文件后缀猜测 Content-Type
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
rust-embed = { version = "8.0", features = ["include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[package.metadata.deb]
name = "agentbridge"
maintainer = "AgentBridge Team <support@indexflowing.com>"
copyright = "2026, AgentBridge Contributors"
extended-description = "Autonomous Multi-Agent MCP Bridge Gateway (Headless Core Daemon)"
section = "net"
priority = "optional"
assets = [
    # 👈 只放二进制即可！service 文件交给下面的 systemd-units 自动处理，绝不重复！
    ["target/release/agentbridge", "usr/bin/agentbridge", "755"],
]
maintainer-scripts = "debian"
systemd-units = { unit-name = "agentbridge" }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1