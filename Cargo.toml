[package]
name = "agentbridge"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Connect AI brains to local coding agents through MCP"
license = "MIT"
readme = "README.md"
keywords = ["mcp", "ai", "agent", "bridge"]
categories = ["command-line-utilities", "development-tools"]
repository = "https://github.com/IndexFlowing/AgentBridge"
authors = ["IndexFlowing"]

[[bin]]
name = "agentbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
