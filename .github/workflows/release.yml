name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 1. 全平台二进制构建 (Linux, Apple Silicon, Intel Mac, Windows)
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false # 👈 防止某个系统偶发失败中断其他系统构建
      matrix:
        include:
          # Linux (x86_64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Apple Silicon Mac (M1/M2/M3/M4)
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Mac
          - target: x86_64-apple-darwin
            os: macos-13
          # Windows (x86_64 .exe)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 👈 在 Linux 机器上安装 glib 与 ssl 系统基础库，彻底解决 glib-sys 缺失
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and Upload Binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: agentbridge
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}

  # 2. Linux .deb 包打包并发布到 Cloudsmith 与 GitHub Release
  package-deb-and-cloudsmith:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 👈 安装 glib 与 ssl 依赖库
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools (cargo-deb & cloudsmith-cli)
        run: |
          cargo install cargo-deb
          pip install --upgrade cloudsmith-cli

      - name: Build release binary and .deb package
        run: |
          cargo build --release --bin agentbridge
          cargo deb --no-build

      # 将生成的 .deb 包附加到本次 GitHub Release
      - name: Upload .deb to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" target/debian/*.deb

      # 如果在仓库 Secrets 中配置了 CLOUDSMITH_API_KEY，自动推送到 Cloudsmith APT 仓库
      - name: Push .deb package to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith push deb indexflowing/agentbridge-mcp/ubuntu/jammy target/debian/*.deb || true