name: Release Linux & Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 👈 安装 Linux 必需的所有 C 库支持（包含 glib, gdk3, atk, ssl）
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools (cargo-deb & cloudsmith-cli)
        run: |
          cargo install cargo-deb
          pip install --upgrade cloudsmith-cli

      - name: Build pure Linux CLI binary
        run: |
          # 明确指定只编译主包 agentbridge，隔离 desktop
          cargo build --release --package agentbridge --bin agentbridge

      - name: Build .deb package
        run: |
          cargo deb --no-build

      - name: Prepare tarball archive
        run: |
          mkdir -p dist
          cp target/release/agentbridge dist/
          cp debian/agentbridge.service dist/
          tar -czf dist/agentbridge-linux-amd64.tar.gz -C dist agentbridge agentbridge.service
          cp target/debian/*.deb dist/

      # 1. 发布到 GitHub Releases（包含 .tar.gz 与 .deb 安装包）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/agentbridge-linux-amd64.tar.gz
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 自动推送到 Cloudsmith APT 仓库
      - name: Push .deb package to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith push deb indexflowing/agentbridge-mcp/ubuntu/jammy dist/*.deb || true