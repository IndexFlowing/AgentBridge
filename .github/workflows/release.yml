name: Release Linux (Native AMD64 & ARM64)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. 启动原生 Intel/AMD64 虚拟机
          - os: ubuntu-22.04
            arch: amd64

          # 2. 启动原生 ARM64 硬件虚拟机（真正 ARM CPU）
          - os: ubuntu-24.04-arm
            arch: arm64

    # 👈 分别在两台不同的架构服务器上原生运行
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 智能缓存加速
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # 原生安装打包工具
      - name: Install packaging tools
        run: |
          pip install --upgrade cloudsmith-cli
          cargo install cargo-deb

      # 原生编译二进制（绝不使用 cross，完全原生本地编译）
      - name: Build native binary
        run: |
          cargo build --release --package agentbridge --bin agentbridge

      # 原生打包 .deb（调用各自系统的原生 strip 和 dpkg，绝无架构报错）
      - name: Build .deb package
        run: |
          cargo deb --no-build

      # 整理归档资产
      - name: Prepare assets
        run: |
          mkdir -p dist
          cp target/release/agentbridge dist/
          cp debian/agentbridge.service dist/
          tar -czf dist/agentbridge-linux-${{ matrix.arch }}.tar.gz -C dist agentbridge agentbridge.service
          cp target/debian/*.deb dist/

      # 1. 发布到 GitHub Releases
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/agentbridge-linux-${{ matrix.arch }}.tar.gz
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. 推送到 Cloudsmith
      - name: Push .deb package to Cloudsmith
        if: env.CLOUDSMITH_API_KEY != ''
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          cloudsmith push deb indexflowing/agentbridge-mcp/any-distro/any-version dist/*.deb || true